<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1><i class="fas fa-sticky-note"></i> Notes App</h1>
      <div class="header-stats">
        <span id="totalNotes">0 notes</span>
      </div>
    </header>
    
    <div class="search-bar">
      <div class="search-input-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search notes by title, content, or tags...">
      </div>
      <button onclick="searchNotes()" class="btn btn-primary"><i class="fas fa-search"></i> Search</button>
      <button onclick="loadNotes()" class="btn btn-secondary"><i class="fas fa-times"></i> Clear</button>
    </div>

    <div class="filter-bar">
      <button onclick="filterNotes('all')" class="filter-btn active" data-filter="all">All</button>
      <button onclick="filterNotes('pinned')" class="filter-btn" data-filter="pinned"><i class="fas fa-thumbtack"></i> Pinned</button>
      <button onclick="filterNotes('recent')" class="filter-btn" data-filter="recent"><i class="fas fa-clock"></i> Recent</button>
    </div>

    <div class="note-form">
      <h2><i class="fas fa-plus-circle"></i> Create Note</h2>
      <input type="text" id="noteTitle" placeholder="Note title">
      <textarea id="noteContent" placeholder="Note content"></textarea>
      <div class="form-additions">
        <div class="color-picker">
          <label>Color:</label>
          <div class="color-options">
            <div class="color-option" data-color="#ffffff" style="background-color: #ffffff; border: 2px solid #ddd;"></div>
            <div class="color-option" data-color="#ffeaa7" style="background-color: #ffeaa7;"></div>
            <div class="color-option" data-color="#74b9ff" style="background-color: #74b9ff;"></div>
            <div class="color-option" data-color="#55efc4" style="background-color: #55efc4;"></div>
            <div class="color-option" data-color="#ff7675" style="background-color: #ff7675;"></div>
            <div class="color-option" data-color="#a29bfe" style="background-color: #a29bfe;"></div>
            <div class="color-option" data-color="#fd79a8" style="background-color: #fd79a8;"></div>
          </div>
        </div>
        <div class="tags-input">
          <label>Tags (comma separated):</label>
          <input type="text" id="noteTags" placeholder="work, personal, ideas">
        </div>
      </div>
      <button onclick="createNote()" class="btn btn-success"><i class="fas fa-plus"></i> Create Note</button>
    </div>

    <div class="notes-list" id="notesList"></div>
  </div>

  <div id="noteModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2><i class="fas fa-edit"></i> Edit Note</h2>
      <input type="hidden" id="editNoteId">
      <input type="text" id="editNoteTitle" placeholder="Note title">
      <textarea id="editNoteContent" placeholder="Note content"></textarea>
      <div class="form-additions">
        <div class="color-picker">
          <label>Color:</label>
          <div class="color-options" id="editColorOptions">
            <div class="color-option" data-color="#ffffff" style="background-color: #ffffff; border: 2px solid #ddd;"></div>
            <div class="color-option" data-color="#ffeaa7" style="background-color: #ffeaa7;"></div>
            <div class="color-option" data-color="#74b9ff" style="background-color: #74b9ff;"></div>
            <div class="color-option" data-color="#55efc4" style="background-color: #55efc4;"></div>
            <div class="color-option" data-color="#ff7675" style="background-color: #ff7675;"></div>
            <div class="color-option" data-color="#a29bfe" style="background-color: #a29bfe;"></div>
            <div class="color-option" data-color="#fd79a8" style="background-color: #fd79a8;"></div>
          </div>
        </div>
        <div class="tags-input">
          <label>Tags (comma separated):</label>
          <input type="text" id="editNoteTags" placeholder="work, personal, ideas">
        </div>
      </div>
      <button onclick="updateNote()" class="btn btn-primary"><i class="fas fa-save"></i> Update Note</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
